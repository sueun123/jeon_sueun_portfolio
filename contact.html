<body class="contact-page">
  <header class="site-header" aria-label="주요 메뉴">
    <nav class="site-nav">
      <a href="./index.html#home">Home</a>
      <a href="./index.html#about">About</a>
      <a href="./index.html#projects">Projects</a>
      <a href="./index.html#objects">Objects</a>
      <a href="./contact.html" aria-current="page">Contact</a>
    </nav>
  </header>
  <main class="contact-main">
    <section class="contact-intro" aria-labelledby="contact-title">
      <h1 id="contact-title">LET’S<br />CREATE<br />TOGETHER</h1>
      <p>협업 및 채용 문의 연락처를 남기는 폼입니다.</p>
    </section>
    <section class="contact-form-panel" aria-label="문의 입력 폼">
      <form id="contact-form">
        <div class="form-field">
          <label for="contact-name">Name <span aria-hidden="true">*</span><span class="field-state" aria-hidden="true">입력 중</span></label>
          <input id="contact-name" name="name" type="text" placeholder="Enter your name" autocomplete="name" required />
        </div>
        <div class="form-field">
          <label for="contact-email">Email <span aria-hidden="true">*</span><span class="field-state" aria-hidden="true">입력 중</span></label>
          <input id="contact-email" name="email" type="email" placeholder="Enter your email" autocomplete="email" required />
        </div>
        <div class="form-field">
          <label for="contact-message">Message<span class="field-state" aria-hidden="true">입력 중</span></label>
          <textarea id="contact-message" name="message" placeholder="Tell me about your message"></textarea>
        </div>
        <button class="contact-submit" type="submit">SEND MESSAGE <span aria-hidden="true">→</span></button>
        <p class="form-feedback" id="form-feedback" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <footer class="contact-footer">
    <div class="contact-footer-main">
      <div><strong>Contact</strong><a href="mailto:love_9336@naver.com">love_9336@naver.com</a><a href="tel:+12345678910">+1 (234) 567-8910</a></div>
      <div class="contact-social">Instagram · LinkedIn ·</div>
    </div>
    <div class="contact-footer-bottom">© 2026 Jeon sueun</div>
  </footer>
